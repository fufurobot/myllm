[project]
name = "myllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "fufu", email = "fufurobot@outlook.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "cwsandbox[wandb]>=1.19.1",
    "harbor>=0.24.0",
    "huggingface-hub>=0.36.2",
    "rwkv7-hf>=0.9.0",
    # Backend-neutral upper bound: keeps the transitive torch (pulled in by
    # rwkv7-hf) from resolving to an unrelated PyPI build. The concrete
    # backend wheel is chosen by the cpu / cu118 extras below.
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "transformers>=4.57.6",
]

# Select the torch backend on install:
#   uv sync --extra cpu     -> CPU-only wheels
#   uv sync --extra cu118   -> NVIDIA CUDA 11.8 wheels
# The two extras are declared mutually exclusive in [tool.uv.conflicts] below,
# which lets uv resolve each backend into its own split. Choose exactly one.
[project.optional-dependencies]
cpu = ["torch==2.7.1+cpu", "torchaudio==2.7.1+cpu", "torchvision==0.22.1+cpu"]
cu118 = [
    "torch==2.7.1+cu118",
    "torchaudio==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
]

[project.scripts]
myllm = "myllm:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# cpu and cu118 provide the same packages from different indexes and can never
# be installed together; declaring the conflict lets uv resolve them separately.
conflicts = [[{ extra = "cpu" }, { extra = "cu118" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupyterlab",
    "marimo",
    "pytest>=8.4.2",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
