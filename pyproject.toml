[project]
name = "myllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fufu", email = "fufurobot@outlook.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "huggingface-hub>=0.36.2",
    "rwkv7-hf>=0.9.0",
    "torch==2.7.1+cu118",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "transformers>=4.57.6",
]

[project.scripts]
myllm = "myllm:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.4.2",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
